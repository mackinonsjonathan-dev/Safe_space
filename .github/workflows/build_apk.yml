name: Build Safe Space APK 🇰🇪

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android platform files exist
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Check Android Internet Permission
        run: |
          grep -n "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || echo "INTERNET permission not found"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safe-space-app
          path: build/app/outputs/flutter-apk/app-release.apk
          
